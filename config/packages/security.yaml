security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Role hierarchy - ROLE_ADMIN has all permissions
    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER, ROLE_DOCTOR, ROLE_PATIENT]
        ROLE_DOCTOR: [ROLE_USER]
        ROLE_PATIENT: [ROLE_USER]

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthenticator

            logout:
                path: app_logout
                target: app_customer

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    # ✅ OBLIGATOIREMENT sous "security"
    access_control:
        # Pages publiques
        - { path: ^/login, roles: PUBLIC_ACCESS } 
        - { path: ^/registration, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: PUBLIC_ACCESS }  # API routes accessible to authenticated users
        
        # User dashboard - requires authentication
        - { path: ^/dashboard, roles: ROLE_USER }
        
        # Pages admin (ADMIN role)
        - { path: ^/admin, roles: ROLE_ADMIN }
        
        # Pages medecin (DOCTOR role)
        - { path: ^/medecin, roles: ROLE_DOCTOR }
        
        # Pages patient (PATIENT role)
        - { path: ^/patient, roles: ROLE_PATIENT }


when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
